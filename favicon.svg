<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a18"/>
      <stop offset="100%" stop-color="#0d0d2a"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="dot1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="32" height="32" rx="8" fill="none" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- "S" lettermark with gradient -->
  <text x="16" y="22" font-family="'Arial', sans-serif" font-size="18" font-weight="900"
        text-anchor="middle" fill="url(#glyph)">S</text>

  <!-- Neural accent dots -->
  <circle cx="6" cy="6" r="1.2" fill="#00d4ff" opacity="0.7"/>
  <circle cx="26" cy="6" r="1.2" fill="#7c3aed" opacity="0.7"/>
  <circle cx="6" cy="26" r="1.2" fill="#7c3aed" opacity="0.5"/>
  <circle cx="26" cy="26" r="1.2" fill="#00d4ff" opacity="0.5"/>

  <!-- Connection lines (neural) -->
  <line x1="6" y1="6" x2="26" y2="6" stroke="#00d4ff" stroke-width="0.4" stroke-opacity="0.2"/>
  <line x1="6" y1="6" x2="6" y2="26" stroke="#7c3aed" stroke-width="0.4" stroke-opacity="0.2"/>
  <line x1="26" y1="6" x2="26" y2="26" stroke="#7c3aed" stroke-width="0.4" stroke-opacity="0.2"/>
  <line x1="6" y1="26" x2="26" y2="26" stroke="#00d4ff" stroke-width="0.4" stroke-opacity="0.2"/>
</svg>
